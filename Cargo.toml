[package]
name = "chatty"
version = "0.1.0"
edition = "2024"
description = "Personal push-to-talk dictation for Windows and macOS"
license = "MIT"
publish = false

[dependencies]
# The prebuilt native library version is read from this line by
# scripts/fetch-native.ps1. Change it here only.
transcribe-cpp = { version = "=0.5.1", default-features = false }
cpal = "0.18.2"
log = { version = "0.4.35", features = ["std"] }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"
toml = "1.2.3"
toml_edit = "0.25.21"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Media_Audio",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Console",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"

# macOS: AppKit through the Objective-C runtime; CoreGraphics, CoreText,
# ApplicationServices (event tap, accessibility) and IOKit (HID) are plain C
# APIs declared in src/mac/sys.rs.
[target.'cfg(target_os = "macos")'.dependencies]
# Messages are sent untyped (msg_send!), so the debug-build encoding checks
# would only reject toll-free-bridged CF pointers.
objc2 = { version = "0.6.5", features = ["disable-encoding-assertions"] }
objc2-foundation = "0.3.2"
libc = "0.2"

[profile.release]
# Thin LTO keeps codegen parallel: a clean build fits in CI's 5-minute
# budget, where fat LTO with one codegen unit serializes the final crate.
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
panic = "unwind"

