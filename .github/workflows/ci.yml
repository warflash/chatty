name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Prebuilt transcribe.cpp + llama.cpp; keyed on the pins.
      - uses: actions/cache@v4
        with:
          path: native
          key: native-${{ hashFiles('Cargo.toml', 'scripts/fetch-native.ps1') }}

      - name: Fetch prebuilt native libraries
        shell: pwsh
        run: ./scripts/fetch-native.ps1

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: chatty
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-ChildItem dist/*.zip).FullName --generate-notes
        shell: pwsh
